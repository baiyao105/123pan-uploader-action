name: Test 123Pan Upload Action

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create test file
        run: |
          echo "Integration test file - $(date)" > integration-test.txt

      - name: Test 123Pan Upload Action
        uses: ./
        with:
          auth-method: "password"
          username: ${{ secrets.PAN123_USERNAME }}
          password: ${{ secrets.PAN123_PASSWORD }}
          path: "./integration-test.txt"
          destination: "github-actions-test"
          conflict-strategy: "keep-both"
